# CI do Command Center (issue #16). Todo PR e todo push no branch do VPS passam por aqui:
# lint, testes unitários e de integração, build do frontend e end-to-end no navegador.
name: CI

on:
  pull_request:
  push:
    branches: [claude/configurar-open-claw-ooqo8x, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python — ruff + pytest (unitários e integração)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: command_center/requirements.txt
      - run: pip install -r command_center/requirements.txt pytest httpx ruff
      - run: ruff check .
      - run: python -m pytest -q

  web:
    name: Frontend — tsc + oxlint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: command_center/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: command_center/web/package-lock.json
      - run: npm ci
      - run: npx oxlint src          # erro quebra; os avisos antigos ficam para limpeza gradual
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: command_center/web/dist
          retention-days: 3

  e2e:
    name: End-to-end — Playwright no Chromium
    runs-on: ubuntu-latest
    needs: web
    env:
      # o conftest troca o HOME por uma pasta vazia (isolamento): o Chromium fica num lugar fixo
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: command_center/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: command_center/web/dist
      - run: pip install -r command_center/requirements.txt pytest httpx playwright
      - run: python -m playwright install --with-deps chromium
      - run: CC_E2E=1 python -m pytest -q command_center/tests/e2e
